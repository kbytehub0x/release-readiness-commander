modules:
  rovo:agent:
    - key: release-readiness-commander-agent
      name: Release Readiness Commander
      description: An AI Release Gate that evaluates whether a software release is safe to ship by analyzing Jira blockers, Teamwork Graph dependencies, and sensitive data clearance.
      prompt: >
        You are the Release Readiness Commander, an expert AI Release Gate teammate.
        Your goal is to help engineering leads and release managers determine whether a software release is safe to deploy to production.

        When asked if a release is ready to ship:
        1. Invoke the `evaluateReleaseReadiness` skill to calculate the deterministic readiness score and inspect gate findings.
        2. When asked why a release is blocked or to explain the score, invoke `explainScore` to provide the itemized deductions with owner and remediation steps.
        3. If the user asks about security clearance, credentials, or PII, invoke `scanReleaseSecurity`.
        4. Explain decisions using concrete evidence: rule IDs, ticket keys, owners, and recommended remediation actions.
        5. Provide an actionable recommendation: GO (ready to deploy), CONDITIONAL GO (review required), or NO-GO (release blocked).
      conversationStarters:
        - Is release v2.4.0-RC1 ready to ship?
        - Why is this release No-Go? Explain the score
        - Scan release tickets for sensitive data and credential leaks
        - Show open Teamwork Graph dependencies holding up the release
      actions:
        - evaluateReleaseReadiness
        - explainScore
        - scanReleaseSecurity
        - getReleaseDependencies
        - hello-world-logger

  jira:projectPage:
    - key: release-readiness-cockpit
      title: Release Readiness Cockpit
      render: native
      resource: main-frontend
      resolver:
        function: backend-resolver

  jira:globalPage:
    - key: release-readiness-global-cockpit
      title: Release Readiness Cockpit
      render: native
      resource: main-frontend
      resolver:
        function: backend-resolver

  action:
    - key: evaluateReleaseReadiness
      name: Assess Release Readiness
      function: evaluateReleaseFn
      actionVerb: GET
      description: Evaluates Jira release tickets, blockers, dependencies, and security clearance to compute an evidence-backed Go/No-Go score.
      inputs:
        releaseVersion:
          title: Release Version
          type: string
          required: false
          description: Target release version name (e.g. v2.4.0-RC1).
        projectKey:
          title: Project Key
          type: string
          required: false
          description: Jira project key (e.g. ENG).

    - key: explainScore
      name: Explain Readiness Score
      function: explainScoreFn
      actionVerb: GET
      description: Returns an itemized, auditable breakdown of every point deduction, affected ticket, owner, and required remediation action.
      inputs:
        releaseVersion:
          title: Release Version
          type: string
          required: false
          description: Target release version name.
        projectKey:
          title: Project Key
          type: string
          required: false
          description: Jira project key.

    - key: scanReleaseSecurity
      name: Scan Security Clearance Gate
      function: scanSecurityFn
      actionVerb: GET
      description: Scans release issue text and comments for exposed credentials, API keys, tokens, and sensitive PII.
      inputs:
        releaseVersion:
          title: Release Version
          type: string
          required: false
          description: Target release version name.
        projectKey:
          title: Project Key
          type: string
          required: false
          description: Jira project key.

    - key: getReleaseDependencies
      name: Inspect Teamwork Graph Dependencies
      function: getDependenciesFn
      actionVerb: GET
      description: Analyzes cross-project issue links and upstream/downstream service dependency chains holding up the release.
      inputs:
        releaseVersion:
          title: Release Version
          type: string
          required: false
          description: Target release version name.
        projectKey:
          title: Project Key
          type: string
          required: false
          description: Jira project key.

    - key: hello-world-logger
      name: Log a message
      function: messageLogger
      actionVerb: GET
      description: Logs a verification message.
      inputs:
        message:
          title: Message
          type: string
          required: true
          description: The message to log.

  function:
    - key: backend-resolver
      handler: index.handler
    - key: evaluateReleaseFn
      handler: index.evaluateReleaseReadiness
    - key: explainScoreFn
      handler: index.explainScore
    - key: scanSecurityFn
      handler: index.scanReleaseSecurity
    - key: getDependenciesFn
      handler: index.getReleaseDependencies
    - key: messageLogger
      handler: index.messageLogger

resources:
  - key: main-frontend
    path: src/frontend/index.jsx

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:space:confluence
    - read:page:confluence
    - write:page:confluence

app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/5c1b3b3c-0be8-4cf1-a15b-9550459dc6d0
